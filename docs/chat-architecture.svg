<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Outbox 기반 채팅과 WebRTC 음성 통화 아키텍처</title>
  <desc id="desc">웹과 모바일 클라이언트의 채팅 메시지를 MySQL outbox에 먼저 저장하고 Kafka 배치 처리 후 WebSocket으로 전달하며, 음성 통화는 STOMP 시그널링과 Redis 상태 관리 및 STUN TURN 연결을 사용하는 구조</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="clientFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 800 40px 'Pretendard','Noto Sans KR',Arial,sans-serif; fill: #17202a; }
      .subtitle { font: 500 19px 'Pretendard','Noto Sans KR',Arial,sans-serif; fill: #64748b; }
      .lane-title { font: 800 22px 'Pretendard','Noto Sans KR',Arial,sans-serif; fill: #0f766e; }
      .lane-title.voice { fill: #7c3aed; }
      .node-title { font: 800 22px 'Pretendard','Noto Sans KR',Arial,sans-serif; fill: #17202a; }
      .node-title.light { fill: #fff; }
      .node-copy { font: 500 15px 'Pretendard','Noto Sans KR',Arial,sans-serif; fill: #52606d; }
      .node-copy.light { fill: #dbeafe; }
      .label { font: 700 14px 'Pretendard','Noto Sans KR',Arial,sans-serif; fill: #0f766e; }
      .label.blue { fill: #2563eb; }
      .label.voice { fill: #7c3aed; }
      .pill { font: 800 13px 'Pretendard','Noto Sans KR',Arial,sans-serif; fill: #fff; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .client { fill: url(#clientFill); stroke: #1d4ed8; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .primary { fill: #ecfdf5; stroke: #0f766e; stroke-width: 3; rx: 18; filter: url(#shadow); }
      .data { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; rx: 18; filter: url(#shadow); }
      .voice-card { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 3; rx: 18; filter: url(#shadow); }
      .flow { fill: none; stroke: #0f766e; stroke-width: 4; marker-end: url(#arrowTeal); }
      .delivery { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrowBlue); }
      .signal { fill: none; stroke: #7c3aed; stroke-width: 4; marker-end: url(#arrowViolet); }
      .state { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowViolet); }
      .media { fill: none; stroke: #2563eb; stroke-width: 4; stroke-dasharray: 12 8; marker-end: url(#arrowBlue); }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 12 10; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="url(#background)"/>
  <text x="800" y="58" text-anchor="middle" class="title">Outbox 기반 실시간 채팅 · WebRTC 음성 통화</text>
  <text x="800" y="94" text-anchor="middle" class="subtitle">메시지는 먼저 안전하게 저장하고, 통화 미디어는 STUN/TURN으로 네트워크 경계를 넘습니다</text>

  <rect x="52" y="126" width="1496" height="552" rx="24" fill="#ffffff" fill-opacity="0.62" stroke="#d7e3e0" stroke-width="2"/>
  <text x="82" y="166" class="lane-title">CHAT &amp; NOTIFICATION EVENT PIPELINE</text>

  <rect x="76" y="212" width="238" height="196" class="client"/>
  <text x="195" y="258" text-anchor="middle" class="node-title light">Web · Mobile</text>
  <text x="195" y="294" text-anchor="middle" class="node-copy light">Cookie / Bearer JWT</text>
  <text x="195" y="326" text-anchor="middle" class="node-copy light">REST · STOMP / WSS</text>
  <rect x="120" y="350" width="150" height="34" rx="17" fill="#2563eb"/>
  <text x="195" y="373" text-anchor="middle" class="pill">1. SEND</text>

  <rect x="374" y="192" width="276" height="236" class="primary"/>
  <text x="512" y="238" text-anchor="middle" class="node-title">Spring Boot</text>
  <text x="512" y="274" text-anchor="middle" class="node-copy">방·회원·금칙어 검증</text>
  <text x="512" y="306" text-anchor="middle" class="node-copy">메시지 ID·시간 부여</text>
  <text x="512" y="338" text-anchor="middle" class="node-copy">알림 DB 저장</text>
  <rect x="421" y="365" width="182" height="36" rx="18" fill="#0f766e"/>
  <text x="512" y="389" text-anchor="middle" class="pill">MessageProducer</text>

  <rect x="712" y="192" width="290" height="236" class="data"/>
  <text x="857" y="238" text-anchor="middle" class="node-title">MySQL Outbox</text>
  <text x="857" y="274" text-anchor="middle" class="node-copy">Kafka 발행 전 이벤트 저장</text>
  <text x="857" y="306" text-anchor="middle" class="node-copy">nextAttemptAt · attemptCount</text>
  <text x="857" y="338" text-anchor="middle" class="node-copy">10회 실패 시 dead letter</text>
  <rect x="770" y="365" width="174" height="36" rx="18" fill="#2563eb"/>
  <text x="857" y="389" text-anchor="middle" class="pill">2. durable write</text>

  <rect x="1064" y="192" width="278" height="236" class="primary"/>
  <text x="1203" y="238" text-anchor="middle" class="node-title">Outbox Dispatcher</text>
  <text x="1203" y="274" text-anchor="middle" class="node-copy">commit 후 즉시 발행</text>
  <text x="1203" y="306" text-anchor="middle" class="node-copy">실패: 5초 → 최대 30분</text>
  <text x="1203" y="338" text-anchor="middle" class="node-copy">안전 poll: 30초 → 최대 5분</text>
  <rect x="1116" y="365" width="174" height="36" rx="18" fill="#0f766e"/>
  <text x="1203" y="389" text-anchor="middle" class="pill">3. AFTER_COMMIT</text>

  <rect x="1390" y="212" width="134" height="196" class="primary"/>
  <text x="1457" y="258" text-anchor="middle" class="node-title">Kafka</text>
  <text x="1457" y="294" text-anchor="middle" class="node-copy">chat</text>
  <text x="1457" y="322" text-anchor="middle" class="node-copy">roomId key</text>
  <text x="1457" y="350" text-anchor="middle" class="node-copy">notification</text>
  <text x="1457" y="378" text-anchor="middle" class="node-copy">acks=all</text>

  <path d="M314 310 H374" class="flow"/>
  <path d="M650 310 H712" class="flow"/>
  <path d="M1002 310 H1064" class="flow"/>
  <path d="M1342 310 H1390" class="flow"/>

  <rect x="1078" y="486" width="286" height="154" class="primary"/>
  <text x="1221" y="528" text-anchor="middle" class="node-title">Batch Consumer</text>
  <text x="1221" y="562" text-anchor="middle" class="node-copy">최대 100건 poll · 중복 ID 제외</text>
  <text x="1221" y="592" text-anchor="middle" class="node-copy">JPA batch insert · 방 요약 갱신</text>
  <text x="1221" y="620" text-anchor="middle" class="node-copy">알림은 Redis Pub/Sub로 전달</text>

  <rect x="716" y="486" width="286" height="154" class="data"/>
  <text x="859" y="528" text-anchor="middle" class="node-title">MySQL</text>
  <text x="859" y="562" text-anchor="middle" class="node-copy">채팅 메시지·방 요약</text>
  <text x="859" y="592" text-anchor="middle" class="node-copy">회원·알림·도메인 데이터</text>
  <text x="859" y="620" text-anchor="middle" class="node-copy">commit 완료 후 결과 반환</text>

  <rect x="374" y="486" width="276" height="154" class="card"/>
  <text x="512" y="528" text-anchor="middle" class="node-title">Realtime Delivery</text>
  <text x="512" y="562" text-anchor="middle" class="node-copy">WebSocket 방 구독</text>
  <text x="512" y="592" text-anchor="middle" class="node-copy">Redis Pub/Sub → SSE</text>
  <text x="512" y="620" text-anchor="middle" class="node-copy">저장된 이벤트만 전달</text>

  <path d="M1457 408 V456 Q1457 468 1445 468 H1221 V486" class="flow"/>
  <text x="1370" y="458" class="label">4. batch poll</text>
  <path d="M1078 563 H1002" class="flow"/>
  <text x="1040" y="546" text-anchor="middle" class="label">5. save</text>
  <path d="M716 563 H650" class="delivery"/>
  <text x="683" y="546" text-anchor="middle" class="label blue">6. commit</text>
  <path d="M374 563 H332 Q304 563 304 535 V436 Q304 408 276 408 H195" class="delivery"/>
  <text x="315" y="462" class="label blue">7. WS / SSE</text>

  <line x1="52" y1="720" x2="1548" y2="720" class="divider"/>
  <text x="82" y="762" class="lane-title voice">1:1 AUDIO CALL PIPELINE</text>

  <rect x="76" y="802" width="250" height="178" class="client"/>
  <text x="201" y="848" text-anchor="middle" class="node-title light">Caller · Receiver</text>
  <text x="201" y="884" text-anchor="middle" class="node-copy light">WebRTC peer connection</text>
  <text x="201" y="916" text-anchor="middle" class="node-copy light">마이크 · 음소거 · 기기 선택</text>
  <text x="201" y="948" text-anchor="middle" class="node-copy light">연결 해제 시 자동 종료</text>

  <rect x="422" y="802" width="288" height="178" class="voice-card"/>
  <text x="566" y="848" text-anchor="middle" class="node-title">STOMP Signaling</text>
  <text x="566" y="884" text-anchor="middle" class="node-copy">/api/audio/signal</text>
  <text x="566" y="916" text-anchor="middle" class="node-copy">/user/queue/audio-call</text>
  <text x="566" y="948" text-anchor="middle" class="node-copy">CALL · SDP · ICE · HANGUP</text>

  <rect x="806" y="802" width="286" height="178" class="voice-card"/>
  <text x="949" y="848" text-anchor="middle" class="node-title">Redis Call State</text>
  <text x="949" y="884" text-anchor="middle" class="node-copy">Lua 원자적 생성·전이·종료</text>
  <text x="949" y="916" text-anchor="middle" class="node-copy">1인 1통화 · 세션 소유권</text>
  <text x="949" y="948" text-anchor="middle" class="node-copy">RINGING 45초 · ACTIVE 12시간</text>

  <rect x="1190" y="802" width="334" height="178" class="data"/>
  <text x="1357" y="848" text-anchor="middle" class="node-title">STUN · Coturn</text>
  <text x="1357" y="884" text-anchor="middle" class="node-copy">HMAC 임시 TURN 자격증명</text>
  <text x="1357" y="916" text-anchor="middle" class="node-copy">직접 P2P 실패 시 UDP/TCP 중계</text>
  <text x="1357" y="948" text-anchor="middle" class="node-copy">3478 · UDP 49160–49200</text>

  <path d="M326 858 H422" class="signal"/>
  <text x="374" y="842" text-anchor="middle" class="label voice">signal</text>
  <path d="M710 858 H806" class="state"/>
  <text x="758" y="842" text-anchor="middle" class="label voice">state</text>
  <path d="M326 934 Q700 1038 1190 934" class="media"/>
  <text x="758" y="1034" text-anchor="middle" class="label blue">암호화된 음성 미디어: P2P 또는 TURN relay</text>
  <path d="M1190 858 H1128 Q1106 858 1106 836 V788 Q1106 770 1088 770 H244 Q226 770 226 802" class="delivery"/>
  <text x="750" y="792" text-anchor="middle" class="label blue">ICE server 설정: REST /api/chat/audio/ice-servers</text>
</svg>
