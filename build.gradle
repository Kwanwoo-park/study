plugins {
	id 'java'
	id 'org.springframework.boot' version '3.0.5'
	id 'io.spring.dependency-management' version '1.1.0'
}

group = 'spring'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'org.springframework.kafka:spring-kafka'
	compileOnly 'org.projectlombok:lombok:1.18.32'
	annotationProcessor 'org.projectlombok:lombok:1.18.32'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'javax.xml.bind:jaxb-api:2.4.0-b180830.0359'
	runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'
	testImplementation 'org.projectlombok:lombok:1.18.32'
}

tasks.named('test', Test) {
	useJUnitPlatform { excludeTags 'infrastructure' }
	// Tests use embedded H2, independently of the deployment's MySQL settings.
	systemProperty 'spring.jpa.database-platform', 'org.hibernate.dialect.H2Dialect'
	systemProperty 'spring.jpa.properties.hibernate.dialect', 'org.hibernate.dialect.H2Dialect'
}

tasks.register('infrastructureTest', Test) {
	group = 'verification'
	description = 'Checks the MySQL migration, Redis AOF restart, and Kafka outage recovery.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'infrastructure' }
	outputs.upToDateWhen { false }
}

tasks.register('jsTest', Exec) {
	group = 'verification'
	description = 'Runs the essential JavaScript tests using built-in Node.js tools.'
	workingDir rootProject.projectDir
	def scripts = fileTree('src/test/js').matching { include '**/*.test.cjs' }.files.sort()
	commandLine([providers.gradleProperty('nodeExecutable').getOrElse('node'), '--test'] + scripts.collect { it.absolutePath })
}

tasks.named('test') {
	dependsOn tasks.named('jsTest')
}

def buildRevision = providers.provider {
	if (!file('.git').exists()) return [commit: '', dirty: false]
	def readGit = { List<String> args ->
		ByteArrayOutputStream output = new ByteArrayOutputStream()
		try {
			def result = exec {
				commandLine(['git', '--no-optional-locks'] + args)
				standardOutput = output
				errorOutput = new ByteArrayOutputStream()
				ignoreExitValue = true
			}
			return result.exitValue == 0 ? output.toString('UTF-8').trim() : null
		} catch (GradleException ignored) {
			return null
		}
	}
	String commit = readGit(['rev-parse', '--verify', 'HEAD'])
	if (!(commit ==~ /[a-f0-9]{40,64}/)) return [commit: '', dirty: false]
	String changes = readGit(['status', '--porcelain', '--untracked-files=normal'])
	return [commit: commit, dirty: changes == null || !changes.isEmpty()]
}

def deploymentMetadata = tasks.register('deploymentMetadata') {
	def metadataFile = layout.buildDirectory.file('generated/deployment/study-build.properties')
	inputs.property('revision', buildRevision)
	outputs.file(metadataFile)
	doLast {
		def revision = buildRevision.get()
		File destination = metadataFile.get().asFile
		destination.parentFile.mkdirs()
		destination.setText("commit=${revision.commit}\ndirty=${revision.dirty}\n", 'UTF-8')
	}
}

tasks.named('bootJar') {
	from(deploymentMetadata) { into('BOOT-INF/classes/META-INF') }
}

tasks.withType(Jar).configureEach {
	exclude '**/application*.properties', '**/application*.yml', '**/application*.yaml'
}

tasks.register('regressionTest') {
	group = 'verification'
	description = 'Compatibility alias for the essential Java and JavaScript suite.'
	dependsOn tasks.named('test')
}
