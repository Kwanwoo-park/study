<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 To-do list</title>
    <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
    <link rel="stylesheet" href="/css/common/common.css?v=20260830">
    <link rel="stylesheet" href="/css/todo/list.css?v=20261117-sections">
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
<th:block th:replace="~{fragments/common :: memberNavi(${email}, ${profile})}"></th:block>
<main id="todoPage" class="container todo-page">
    <th:block th:replace="~{fragments/common :: notificationBanner}"></th:block>
    <header class="todo-page-header">
        <div>
            <h1 class="simple-page-title">내 To-do list</h1>
            <p>일기와 별개로 관리하는, 나만의 할 일 목록입니다.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="/diary/list">내 일기</a>
            <a class="btn btn-outline-primary btn-sm" href="/todo/week">주간 회고</a>
        </div>
    </header>

    <form id="todoCreateForm" class="todo-create-form">
        <label for="todoContent">새로운 할 일</label>
        <div class="todo-create-fields">
            <input id="todoContent" class="form-control" type="text" maxlength="255"
                   placeholder="할 일을 입력하세요" required autocomplete="off" aria-describedby="todoHelp">
            <button class="btn btn-primary" type="submit">추가</button>
        </div>
        <label for="todoDueDate">마감일 (선택)</label>
        <input id="todoDueDate" class="form-control" type="date">
        <small id="todoHelp">최대 255자 · 완료한 일은 체크해 주세요.</small>
    </form>

    <div id="todoMessage" class="todo-message" role="status" aria-live="polite"></div>
    <section class="todo-section" aria-labelledby="todoPendingTitle">
        <header class="todo-section-header">
            <div>
                <h2 id="todoPendingTitle">미완료</h2>
                <label for="todoDueFilter" class="sr-only">마감일로 보기</label>
                <select class="form-control form-control-sm" id="todoDueFilter">
                    <option value="">전체 미완료</option>
                    <option value="TODAY">오늘 할 일</option>
                    <option value="OVERDUE">기한 지남</option>
                    <option value="UPCOMING">예정</option>
                </select>
            </div>
            <span id="todoPendingCount" class="todo-count"></span>
        </header>
        <button id="todoPendingRetry" class="btn btn-outline-secondary is-hidden" type="button">미완료 목록 다시 불러오기</button>
        <ul id="todoPendingList" class="todo-list" aria-label="미완료 할 일"></ul>
        <p id="todoPendingEmpty" class="todo-empty is-hidden">미완료 할 일이 없습니다.</p>
        <nav class="todo-pagination" aria-label="미완료 목록 페이지">
            <button id="todoPendingPrevious" class="btn btn-outline-secondary btn-sm" type="button" disabled>이전</button>
            <span id="todoPendingPageNumber">0 / 0</span>
            <button id="todoPendingNext" class="btn btn-outline-secondary btn-sm" type="button" disabled>다음</button>
        </nav>
    </section>
    <section class="todo-section todo-completed-section" aria-labelledby="todoCompletedTitle">
        <header class="todo-section-header">
            <div>
                <h2 id="todoCompletedTitle">완료</h2>
                <p>최근 완료한 순서</p>
            </div>
            <span id="todoCompletedCount" class="todo-count"></span>
        </header>
        <button id="todoCompletedRetry" class="btn btn-outline-secondary is-hidden" type="button">완료 목록 다시 불러오기</button>
        <ul id="todoCompletedList" class="todo-list" aria-label="완료한 할 일"></ul>
        <p id="todoCompletedEmpty" class="todo-empty is-hidden">완료한 할 일이 없습니다.</p>
        <nav class="todo-pagination" aria-label="완료 목록 페이지">
            <button id="todoCompletedPrevious" class="btn btn-outline-secondary btn-sm" type="button" disabled>이전</button>
            <span id="todoCompletedPageNumber">0 / 0</span>
            <button id="todoCompletedNext" class="btn btn-outline-secondary btn-sm" type="button" disabled>다음</button>
        </nav>
    </section>
    <noscript>할 일 목록을 사용하려면 JavaScript를 활성화해 주세요.</noscript>
</main>
<script src="/js/todo/list.js?v=due-date"></script>
<script src="/js/common/common.js?v=20261116-navigation"></script>
<th:block th:replace="~{fragments/common :: pageFooter}"></th:block>
</body>
</html>
