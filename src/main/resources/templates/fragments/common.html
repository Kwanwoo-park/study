<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:fragment="memberNavi(email, profile)">
  <nav class="navi">
    <div onclick="fnMain()"><img th:src="@{/img/} + 'ic_home.png'" class="nav-icon"></div>
    <div onclick="fnSearch()"><img th:src="@{/img/} + 'ic_search.png'" class="nav-icon"></div>
    <div onclick="fnWrite()"><img th:src="@{/img/} + 'ic_add_a_photo.png'" class="nav-icon"></div>
    <div onclick="fnChatting()"><img th:src="@{/img/} + 'ic_chatting.png'" class="nav-icon"></div>
    <div id="notification-nav-icon" class="notification-dot" onclick="fnNotification()">
      <img th:src="@{/img/} + 'ic_favorite_border.png'" class="nav-icon">
      <span id="notification-unread-count" class="notification-count-badge" aria-hidden="true"></span>
    </div>
    <div class="nav-settings">
      <button type="button"
              id="navSettingsToggle"
              class="nav-settings-toggle"
              aria-label="개인 설정 열기"
              aria-expanded="false"
              aria-controls="navSettingsMenu">
        <img th:src="@{/img/} + 'ic_settings.png'" class="nav-icon" alt="">
      </button>
      <div id="navSettingsMenu" class="nav-settings-menu" aria-hidden="true">
        <span class="nav-settings-title">개인 설정</span>
        <button type="button"
                class="nav-settings-item"
                sec:authorize="hasAuthority('ROLE_ADMIN')"
                onclick="location.href='/admin/administrator'">관리자 페이지</button>
        <button type="button"
                class="nav-settings-item"
                onclick="location.href='/member/updatePassword'">비밀번호 변경</button>
        <div class="nav-settings-section">
          <span class="nav-settings-label">통화 알림 설정</span>
          <div class="nav-settings-choices">
            <button type="button"
                    class="audioCallPreferenceChoice"
                    data-enabled="true"
                    aria-pressed="false"
                    onclick="fnSetAudioCallNotificationPreference(true)">허용</button>
            <button type="button"
                    class="audioCallPreferenceChoice"
                    data-enabled="false"
                    aria-pressed="false"
                    onclick="fnSetAudioCallNotificationPreference(false)">미허용</button>
          </div>
        </div>
        <div class="nav-settings-section">
          <span class="nav-settings-label">프로필 공개 설정</span>
          <div class="nav-settings-choices">
            <button type="button" onclick="fnSetMemberVisibility('PUBLIC')">공개</button>
            <button type="button" onclick="fnSetMemberVisibility('PRIVATE')">비공개</button>
          </div>
        </div>
        <div class="nav-settings-section">
          <span class="nav-settings-label">화면 테마</span>
          <div class="nav-settings-choices">
            <button type="button" class="themeChoice" data-theme="light" aria-pressed="false">라이트</button>
            <button type="button" class="themeChoice" data-theme="dark" aria-pressed="false">다크</button>
          </div>
        </div>
        <button type="button" class="nav-settings-item" onclick="fnNavigationLogout()">로그아웃</button>
        <button type="button"
                class="nav-settings-item nav-settings-danger"
                onclick="location.href='/member/withdrawal'">회원 탈퇴</button>
      </div>
    </div>
    <div th:onclick="fnDetail([[${email}]])"><img th:src="${profile}" class="profile-icon"></div>
  </nav>
</th:block>

<th:block th:fragment="notificationBanner">
  <div id="notification-banner" class="alert alert-info d-none position-fixed top-0 end-0 m-3" role="alert">
    <span id="notification-message">새 알림</span>
    <button type="button" class="btn-close" aria-label="Close">닫기</button>
  </div>
</th:block>

<th:block th:fragment="pageFooter">
  <footer>
    <div class="card">
      <div class="card-body text-center">
        <p class="card-text"><small class="text-muted">Copyright Park Kwanwoo. All Rights Reserved.</small></p>
      </div>
    </div>
  </footer>
</th:block>
</html>
