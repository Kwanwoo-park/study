<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내가 저장한 게시글</title>
    <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/board/content.css?v=bookmark-thumbnail">
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
<th:block th:replace="~{fragments/common :: memberNavi(${email}, ${profile})}"></th:block>
<main class="container">
    <th:block th:replace="~{fragments/common :: notificationBanner}"></th:block>
    <header class="d-flex align-items-center justify-content-between gap-2">
        <h1 class="simple-page-title">내가 저장한 게시글</h1>
        <a class="btn btn-outline-secondary btn-sm" href="/board/main">게시글 메인</a>
    </header>
    <p>나만 볼 수 있는 목록입니다.</p>
    <p th:if="${bookmarks.empty}">볼 수 있는 저장 게시글이 아직 없어요.</p>
    <article class="card board-bookmark-card flex-row align-items-start p-3 mb-3" th:each="bookmark : ${bookmarks.content}">
        <img th:if="${bookmark.thumbnailUrl != null}" th:src="${bookmark.thumbnailUrl}" class="board-bookmark-thumbnail"
             alt="게시글 사진 미리보기" width="80" height="80" loading="lazy">
        <div class="board-bookmark-summary">
            <div class="board-bookmark-heading">
                <strong th:text="${bookmark.author}"></strong>
                <div class="board-bookmark-actions">
                    <a class="btn btn-outline-primary btn-sm" th:href="@{/board/view(id=${bookmark.boardId})}">원문 보기</a>
                    <button class="btn btn-outline-secondary btn-sm" type="button" data-saved="true" data-bookmark-list
                            aria-pressed="true" th:attr="data-board-bookmark=${bookmark.boardId}">저장 취소</button>
                </div>
            </div>
            <p class="board-bookmark-preview mb-0 mt-2" th:text="${bookmark.content}"></p>
        </div>
    </article>
    <nav class="d-flex gap-2" aria-label="저장 게시글 페이지">
        <a th:if="${bookmarks.hasPrevious()}" class="btn btn-outline-secondary" th:href="@{/board/bookmarks(page=${bookmarks.number - 1})}">이전</a>
        <a th:if="${bookmarks.hasNext()}" class="btn btn-outline-secondary" th:href="@{/board/bookmarks(page=${bookmarks.number + 1})}">다음</a>
    </nav>
</main>
<script src="/js/board/bookmarks.js"></script>
<script src="/js/common/common.js?v=20261116-navigation"></script>
</body>
</html>
