<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Board List</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!--부트스트랩 css 추가-->
    <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
	<link rel="stylesheet" href="/css/common/common.css?v=20261118-standalone">
	<link rel="stylesheet" href="/css/board/view.css?v=board-actions">
	<link rel="stylesheet" href="/css/board/content.css?v=20261011">
	<link rel="stylesheet" href="/css/comment/modal.css?v=20261118-thread">
    <link rel="stylesheet" href="/css/favorite/modal.css">
</head>
<body class="standalone-page board-view-page" th:classappend="${isMobile} ? 'mobile-view' : ''">
<script src="/js/common/theme.js"></script>
<th:block th:replace="~{fragments/common :: memberNavi(${email}, ${profile})}"></th:block>
<button type="button" th:unless="${previous == 0}" id="left" class="left" th:onclick="fnPrevious([[${previous}]])">←</button>
<button type="button" th:unless="${next == 0}" id="right" class="right" th:onclick="fnNext([[${next}]])">→</button>
	<div class="container">
		<th:block th:replace="~{fragments/common :: notificationBanner}"></th:block>
		<th:block th:replace="~{fragments/common :: pageBack('/board/main')}"></th:block>
		<h1 class="simple-page-title">게시글</h1>
		<header class="board-post-header">
			<div class="profile" th:onclick="fnProfile([[${board.member.email}]])">
				<img th:src="${board.member.profile}" class="profile-img">
				<span th:text="${board.member.name}" class="name"></span>
			</div>
			<div class="board-owner-actions" th:if="${#strings.equals(board.member.email, member)}">
				<button type="button" id="edit" class="board-owner-action" onclick="fnEdit()">Edit</button>
				<button type="button" id="complete" class="board-owner-action is-hidden"
						th:onclick="fnEditComplete([[${board.id}]])">Complete</button>
				<button type="button" id="delete" class="board-owner-action"
						th:onclick="fnDelete([[${board.id}]])">Delete</button>
				<button type="button"
						id="visibilityEditButton"
						class="btn btn-outline-primary btn-sm"
						th:text="${board.visibility.name() == 'PRIVATE' ? '공개 설정: 비공개' : '공개 설정: 공개'}"
						onclick="fnVisibilityEdit()">공개 설정</button>
				<div id="visibilityEditPanel" class="board-visibility-panel is-hidden">
					<label for="editVisibility">공개 설정</label>
					<select id="editVisibility" class="form-control">
						<option value="PRIVATE" th:selected="${board.visibility.name() == 'PRIVATE'}">비공개</option>
						<option value="PUBLIC" th:selected="${board.visibility.name() == 'PUBLIC'}">공개</option>
					</select>
					<div class="board-visibility-actions">
						<button type="button"
								id="visibilitySaveButton"
								class="btn btn-primary btn-sm"
								th:onclick="fnVisibilityComplete([[${board.id}]])">저장</button>
						<button type="button"
								id="visibilityCancelButton"
								class="btn btn-outline-secondary btn-sm"
								onclick="fnVisibilityCancel()">취소</button>
					</div>
				</div>
			</div>
		</header>
		<div class="main-image-wrapper">
			<button th:if="${board.img.size > 1}" type="button" class="arrow is-invisible" th:id="'left' + ${board.id}" th:onclick="fnLeft([[${board.id}]], [[${board.img}]])">‹</button>
			<img th:if="${board.img.size == 0}" th:src="@{/img/} + 'IMG_0111.jpeg'" class="main-image" th:id="'main_img' + ${board.id}" th:ondblclick="fnOnlyLike([[${board.id}]])">
			<img th:unless="${board.img.size == 0}" th:src="${board.img[0].imgSrc}" class="main-image" th:id="'main_img' + ${board.id}" th:ondblclick="fnOnlyLike([[${board.id}]])">
			<input type="hidden" th:id="'img' + ${board.id}" th:value="0">
			<button th:if="${board.img.size > 1}" type="button" class="arrow" th:id="'right' + ${board.id}" th:onclick="fnRight([[${board.id}]], [[${board.img}]])">›</button>
			<span th:if="${board.img.size > 1}" class="image-counter" th:id="'imageCounter' + ${board.id}" th:text="'1 / ' + ${board.img.size}"></span>
		</div>
		<div class="info">
			<div class="icon-box">
				<img th:id="'like' + ${board.id}" th:if="${like}" th:src="@{/img/} + ic_favorite.png" class="icon" th:onclick="fnLike([[${board.id}]])">
				<img th:id="'like' + ${board.id}" th:unless="${like}" th:src="@{/img/} + ic_favorite_border.png" class="icon" th:onclick="fnLike([[${board.id}]])">
				<img th:id="'comment' + ${board.id}" th:src="@{/img/} + ic_chat_black.png" class="icon" th:onclick="fnComment([[${board.id}]])">
				<button class="btn btn-outline-secondary btn-sm" type="button"
				        th:attr="data-board-bookmark=${board.id},data-saved=${bookmarked},aria-pressed=${bookmarked}"
				        th:text="${bookmarked ? '저장 취소' : '나만 저장'}">나만 저장</button>
				<a th:unless="${#strings.equals(board.member.email, member)}"
				   class="btn btn-outline-danger btn-sm report-button"
				   th:href="@{/report(targetType='BOARD',targetId=${board.id})}">신고</a>
			</div>
			<div class="like" th:onclick="fnHref([[${board.id}]])">
				<label class="form-label">좋아요</label>
				<label class="form-label" th:id="'like_cnt' + ${board.id}" th:text="${favoriteCount}"></label>
				<label class="form-label">개</label>
			</div>
			<span th:text="${board.member.name}" class="name"></span>
			<pre th:text="${board.content}" id="content"></pre>
			<textarea th:text="${board.content}" class="form-control is-hidden" rows="5" cols="" id="editContent" name="content"></textarea>
			<div class="comment" th:onclick="fnComment([[${board.id}]])">
				<label class="form-label">댓글</label>
				<label class="form-label" th:id="'comment_cnt' + ${board.id}" th:text="${commentCount}"></label>
				<label class="form-label">개 모두 보기</label>
			</div>
		</div>
	</div>
    <th:block th:replace="~{fragments/comment-modal :: commentModal}"></th:block>
    <th:block th:replace="~{fragments/favorite-modal :: favoriteModal}"></th:block>
    <!--부트스트랩 js, jquery 추가-->
		    <script src="/js/lib/jquery.min.js"></script>
		    <script src="/js/lib/bootstrap.min.js"></script>
            <script src="/js/follow/actions.js?v=20261116"></script>
            <script src="/js/favorite/modal.js?v=20261116"></script>
			<script src="/js/common/image-swipe.js"></script>
			<script src="/js/board/common-actions.js?v=20261116-navigation"></script>
			<script src="/js/comment/panel.js?v=20261118-thread"></script>
			<script src="/js/comment/modal.js?v=20261118-thread"></script>
			<script src="/js/board/content.js?v=20261011"></script>
			<script src="/js/board/bookmarks.js"></script>
			<script src="/js/board/view.js?v=20261116-navigation"></script>
			<script src="/js/common/common.js?v=20261116-navigation"></script>
			<script th:if="${board.img.size > 1}" th:inline="javascript">
				const boardImages = /*[[${board.img}]]*/ [];
				enableBoardImageSwipe(/*[[${board.id}]]*/ 0, boardImages);
				preloadAdjacentImages(boardImages, 0);
			</script>
	<th:block th:replace="~{fragments/common :: pageFooter}"></th:block>
	</body>
</html>
