<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kwanwoo Site</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
    <link rel="stylesheet" href="/css/common/common.css?v=20260903">
    <link rel="stylesheet" href="/css/board/main.css?v=20261011">
    <link rel="stylesheet" href="/css/board/content.css?v=20261011">
    <link rel="stylesheet" href="/css/comment/modal.css?v=20261118-thread">
    <link rel="stylesheet" href="/css/favorite/modal.css">
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
    <th:block th:replace="~{fragments/common :: memberNavi(${email}, ${profile})}"></th:block>
    <div class="container">
        <th:block th:replace="~{fragments/common :: notificationBanner}"></th:block>
        <header class="board-page-header">
            <div class="board-page-header-content">
                <h1 class="simple-page-title">게시글</h1>
                <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-outline-primary btn-sm" href="/book-reviews">독후감</a>
                    <a class="btn btn-outline-secondary btn-sm" href="/board/bookmarks">저장한 글</a>
                </div>
            </div>
        </header>
    </div>
    <th:block th:replace="~{fragments/comment-modal :: commentModal}"></th:block>
    <th:block th:replace="~{fragments/favorite-modal :: favoriteModal}"></th:block>
    <!--부트스트랩 js, jquery 추가-->
	    <script src="/js/lib/jquery.min.js"></script>
	    <script src="/js/lib/bootstrap.min.js"></script>
        <script src="/js/common/image-swipe.js"></script>
	    <script src="/js/board/common-actions.js?v=20261116-navigation"></script>
	    <script src="/js/comment/panel.js?v=20261118-thread"></script>
	    <script src="/js/comment/modal.js?v=20261118-thread"></script>
        <script src="/js/follow/actions.js?v=20261116"></script>
        <script src="/js/favorite/modal.js?v=20261116"></script>
        <script src="/js/board/content.js?v=20261011"></script>
        <script src="/js/board/bookmarks.js"></script>
	    <script src="/js/board/main.js?v=bookmarks"></script>
	    <script src="/js/common/common.js?v=20261116-navigation"></script>
</body>
<th:block th:replace="~{fragments/common :: pageFooter}"></th:block>
</html>
