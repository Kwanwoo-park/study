<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Board List</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!--부트스트랩 css 추가-->
    <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
	<link rel="stylesheet" href="/css/common/common.css?v=20260830">
    <link rel="stylesheet" href="/css/board/write.css?v=20260830">
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
    <th:block th:replace="~{fragments/common :: memberNavi(${email}, ${profile})}"></th:block>
    <div class="container">
        <th:block th:replace="~{fragments/common :: notificationBanner}"></th:block>
        <h1 class="simple-page-title">게시글 작성</h1>
        <form method="post" enctype="multipart/form-data">
            <div class="imgDiv">
                <input type="file" id="upload" name="file" accept="image/*" onchange="fnLoad(this)" class="is-hidden" multiple/>
                <button type="button" class="btn btn-primary" id="btn">Image</button>
            </div>
            <textarea class="form-control is-hidden" rows="5" cols="" id="content" name="content"></textarea>
            <div class="form-group is-hidden" id="visibilityGroup">
                <label for="visibility">공개 설정</label>
                <select id="visibility" class="form-control">
                    <option value="PRIVATE">비공개</option>
                    <option value="PUBLIC" selected>공개</option>
                </select>
            </div>
            <div class="btnDiv">
                <button type="button" class="btn btn-success is-hidden" onclick="fnPrevious()" id="previous">Previous</button>
                <button type="button" class="btn btn-primary is-hidden" onclick="fnSave()" id="submit">Submit</button>
                <button type="button" class="btn btn-primary is-hidden" onclick="fnImgSave()" id="img_btn">Image Save</button>
            </div>
        </form>
	</div>
    <!--부트스트랩 js, jquery 추가-->
	<script src="/js/lib/jquery.min.js"></script>
	<script src="/js/lib/bootstrap.min.js"></script>
    <script src="/js/common/image-swipe.js"></script>
	<script src="/js/board/write.js?v=20260905"></script>
	<script src="/js/common/common.js?v=20260824-1"></script>
</body>
<th:block th:replace="~{fragments/common :: pageFooter}"></th:block>
</html>
