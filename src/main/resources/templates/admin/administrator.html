<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Administrator View</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--부트스트랩 css 추가-->
  <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
  <link rel="stylesheet" href="/css/common/common.css">
  <link rel="stylesheet" href="/css/admin/admin.css">
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
  <script src="/js/common/theme.js"></script>
  <div class="container">
    <h1>Admin view</h1>
      <div class="float-left">
        <button type="button" class="btn btn-primary" onclick="javascript:location.href='/admin/memberCheck'">Member List</button>
        <button type="button" class="btn btn-primary" onclick="javascript:location.href='/board/all'">Board List</button>
        <button type="button" class="btn btn-primary" onclick="javascript:location.href='/board/main'">Board Main</button>
        <button type="button" class="btn btn-primary" onclick="javascript:location.href='/portfolio'">Portfolio</button>
      </div>
      <section class="admin-system-panel">
        <div class="admin-system-header">
          <h2>서버 상태</h2>
          <span id="system-status-updated" class="admin-system-updated">불러오는 중</span>
        </div>
        <div id="system-status" class="admin-system-grid"></div>
      </section>
      <section class="admin-incident-dashboard">
        <div class="admin-incident-header">
          <div>
            <span class="admin-section-label">INCIDENTS</span>
            <h2>최근 서버 장애</h2>
            <p>처리되지 않은 서버 예외를 최근 발생 순으로 표시합니다.</p>
          </div>
          <div class="admin-incident-summary">
            <span id="incident-unacknowledged-count" class="admin-incident-count">0건 미확인</span>
            <button type="button" id="incident-refresh" class="btn btn-outline-secondary btn-sm">새로고침</button>
          </div>
        </div>
        <div id="system-incident-list" class="admin-incident-list">
          <div class="admin-incident-empty">장애 기록을 불러오는 중입니다.</div>
        </div>
      </section>
      <section class="admin-report-dashboard">
        <div class="admin-report-dashboard-header">
          <div>
            <h2>최근 신고</h2>
            <span>접수되지 않은 최근 신고 10건</span>
          </div>
          <div class="admin-report-dashboard-actions">
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="location.href='/admin/report'">전체 보기</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="location.href='/admin/report/process'">처리 화면</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="location.href='/admin/report/history'">처리 내역</button>
          </div>
        </div>
        <div id="recent-report-list" class="admin-report-card-grid"></div>
      </section>
      <section class="admin-activity-panel">
        <div class="admin-activity-panel-header">
          <div>
            <span class="admin-section-label">OVERVIEW</span>
            <h2>운영 현황</h2>
          </div>
          <p>사용자 활동과 최근 등록 현황을 한눈에 확인하세요.</p>
        </div>
        <div class="admin-activity-grid">
          <article class="admin-activity-card admin-activity-card-online" id="user-status"></article>
          <article class="admin-activity-card admin-activity-card-member" id="new-user"></article>
          <article class="admin-activity-card admin-activity-card-board" id="new-board"></article>
          <article class="admin-activity-card admin-activity-card-chat" id="active-chat-room"></article>
        </div>
      </section>
  </div>

<!--부트스트랩 js, jquery 추가-->
<script src="/js/lib/jquery.min.js"></script>
<script src="/js/lib/bootstrap.min.js"></script>
<script src="/js/admin/main.js"></script>
</body>
</html>
