<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>관리자 파일 보관함</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
  <link rel="stylesheet" href="/css/common/common.css">
  <link rel="stylesheet" href="/css/admin/files.css?v=20260905">
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
<script src="/js/common/theme.js"></script>
<main class="container admin-files-page">
  <header class="admin-files-header">
    <div>
      <span class="admin-files-label">ADMIN ONLY</span>
      <h1>파일 보관함</h1>
      <p>실행 파일, 압축 파일, 문서 등 모든 형식의 파일을 S3에 보관하세요.</p>
    </div>
    <a class="btn btn-primary" href="/admin/administrator">관리자 홈</a>
  </header>
  <section class="admin-files-panel" aria-labelledby="upload-title">
    <h2 id="upload-title">파일 업로드</h2>
    <p>관리자만 업로드·목록 조회·다운로드할 수 있습니다. 파일은 비공개 S3에 저장하며 실행하거나 압축 해제하지 않습니다.</p>
    <form id="admin-file-form" enctype="multipart/form-data">
      <label for="admin-file-input">업로드할 파일</label>
      <input id="admin-file-input" name="file" type="file" required aria-describedby="admin-file-limit">
      <p id="admin-file-limit">용량 제한을 확인하고 있습니다.</p>
      <div class="admin-files-upload-actions">
        <span id="admin-file-selection">선택된 파일이 없습니다.</span>
        <button id="admin-file-upload" type="submit" class="btn btn-primary" disabled>업로드</button>
      </div>
      <progress id="admin-file-progress" max="100" value="0" aria-label="파일 업로드 진행률" hidden></progress>
    </form>
    <p id="admin-file-status" role="status" aria-live="polite"></p>
  </section>
  <section class="admin-files-panel" aria-labelledby="file-list-title">
    <div class="admin-files-list-header">
      <h2 id="file-list-title">보관된 파일 <span id="admin-file-count"></span></h2>
      <button id="admin-file-refresh" type="button" class="btn btn-outline-primary">새로고침</button>
    </div>
    <div id="admin-file-list" aria-live="polite">파일 목록을 불러오는 중입니다.</div>
    <nav class="admin-files-pagination" aria-label="파일 목록 페이지">
      <button id="admin-file-prev" type="button" class="btn btn-outline-primary" disabled>이전</button>
      <span id="admin-file-page">1 / 1</span>
      <button id="admin-file-next" type="button" class="btn btn-outline-primary" disabled>다음</button>
    </nav>
  </section>
</main>
<script src="/js/admin/files.js?v=20260905"></script>
</body>
</html>
