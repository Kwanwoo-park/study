<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>가입 이메일 인증</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
    <link rel="stylesheet" href="/css/common/common.css">
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
<main class="container">
    <h1>가입 이메일 인증</h1>
    <p class="alert alert-danger" role="alert" th:if="${verificationError}" th:text="${verificationError}"></p>

    <form method="post" th:action="@{/member/register/verify/send}">
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" name="email" maxlength="254"
                   autocomplete="email" th:value="${pendingEmail}" th:readonly="${pendingEmail != null}" required>
        </div>
        <button type="submit" class="btn btn-primary"
                th:text="${pendingEmail == null} ? '인증번호 받기' : '인증번호 다시 받기'">인증번호 받기</button>
    </form>

    <form th:if="${pendingEmail != null}" class="mt-4" method="post" th:action="@{/member/register/verify}">
        <div class="mb-3">
            <label for="code" class="form-label">이메일로 받은 인증번호</label>
            <input type="text" class="form-control" id="code" name="code" minlength="8" maxlength="8"
                   autocomplete="one-time-code" aria-describedby="code-help" required>
            <small id="code-help">인증번호는 5분 동안 유효해요. 5회 틀리면 새 번호를 받아야 해요. 다시 받기는 1분 뒤부터 가능해요.</small>
        </div>
        <button type="submit" class="btn btn-primary">인증 확인</button>
    </form>

    <form th:if="${pendingEmail != null}" class="mt-3" method="post" th:action="@{/member/register/verify/restart}">
        <button type="submit" class="btn btn-outline-secondary">이메일 변경</button>
    </form>
    <a class="btn btn-link mt-2" th:href="@{/member/login}">로그인으로 돌아가기</a>
</main>
</body>
</html>
