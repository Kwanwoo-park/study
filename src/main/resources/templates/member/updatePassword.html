<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>비밀번호 변경</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--부트스트랩 css 추가-->
  <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
  <link rel="stylesheet" href="/css/common/common.css">
  <link rel="stylesheet" href="/css/member/update-password.css?v=20260823">
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
<script src="/js/common/theme.js"></script>
<div id="passwordUpdatePage" class="container password-update-page"
     th:attr="data-verification-required=${emailVerificationRequired}">
  <h1>비밀번호 변경</h1>
  <form id="frm" method="dialog">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" th:value="${email}" disabled>
    </div>
    <div id="emailVerificationSection" class="mb-3 verification-section" th:if="${emailVerificationRequired}">
      <p>계정 보호를 위해 등록된 이메일로 본인 인증을 진행해주세요.</p>
      <button type="button" id="sendVerification" class="btn btn-outline-primary">인증번호 발송</button>
      <div id="verificationCodeGroup" class="verification-code-group is-hidden">
        <label for="verificationCode" class="form-label">이메일 인증번호</label>
        <div class="verification-code-actions">
          <input type="text" class="form-control" id="verificationCode" inputmode="numeric"
                 autocomplete="one-time-code" maxlength="6" placeholder="6자리 인증번호">
          <button type="button" id="verifyCode" class="btn btn-primary">인증 확인</button>
        </div>
      </div>
      <p id="verificationMessage" class="verification-message" role="status" aria-live="polite"></p>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">새 비밀번호</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="새 비밀번호"
             autocomplete="new-password" required>
    </div>
    <button type="button" class="btn btn-success" onclick="history.back(-1)">Previous</button>
    <button type="button" id="update" class="btn btn-primary" th:disabled="${emailVerificationRequired}">Submit</button>
  </form>
</div>
<!--부트스트랩 js, jquery 추가-->
<script src="/js/lib/jquery.min.js"></script>
<script src="/js/lib/bootstrap.min.js"></script>
<script src="/js/member/updatePassword.js?v=20260823"></script>
</body>
</html>
