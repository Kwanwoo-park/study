<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>개인 정보</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--부트스트랩 css 추가-->
  <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
  <link rel="stylesheet" href="/css/common/common.css?v=20260830">
  <link rel="stylesheet" href="/css/follow/follower-modal.css">
  <link rel="stylesheet" href="/css/follow/following-modal.css">
  <link rel="stylesheet" href="/css/member/member-detail.css?v=20260830">
  <link rel="stylesheet" href="/css/comment/modal.css">
  <link rel="stylesheet" href="/css/favorite/modal.css">
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
<th:block th:replace="~{fragments/common :: memberNavi(${member.email}, ${member.profile})}"></th:block>
<th:block th:replace="~{fragments/common :: notificationBanner}"></th:block>
<div class="container" th:attr="data-member-email=${member.email}">
  <form method="dialog" enctype="multipart/form-data">
    <div class="profileDiv">
      <img th:src="${member.profile}" class="profile-image-large" id="profile">
      &nbsp;&nbsp;&nbsp;&nbsp;
      <div class="profileInfo">
        <div class="profileNameRow">
          <label class="form-label profileName" th:text="${member.name}"></label>
          <div class="profileActions">
            <button type="button" class="btn btn-primary is-hidden" id="save" onclick="fnSave()">사진 변경</button>
            <button type="button" class="btn btn-outline-secondary profileMenuToggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
            <div class="profileActionMenu">
              <button type="button" class="btn btn-primary" onclick="location.href='/diary/list'">내 일기</button>
              <button type="button" class="btn btn-primary" onclick="javascript:location.href='/account'">계좌 조회</button>
              <button type="button" class="btn btn-primary" onclick="javascript:location.href='/collection'">Secret</button>
              <button type="button" class="btn btn-primary" onclick="fnForbidden()">금칙어 확인</button>
              <button th:unless="${#strings.equals(member.role, 'ADMIN')}" type="button" class="btn btn-primary" onclick="fnMyReports()">내 신고 내역</button>
              <button th:if="${#strings.equals(member.role, 'ADMIN')}" type="button" class="btn btn-primary" onclick="fnReportApply()">신고 접수 내역</button>
              <button type="button" class="btn btn-outline-danger" onclick="location.href='/appeal'">상소문 작성</button>
            </div>
          </div>
        </div>
        <input type="file" name="file" accept="image/*" onchange="fnLoad(this)" class="is-hidden" id="upload">
        <div class="profileStats">
          <label class="form-label">Posts: </label>
          <label class="form-label" th:text="${board_count}"></label>
          <label class="form-label" th:onclick="openFollowerModal([[${member.email}]])"> Follower: </label>
          <label class="form-label" id="follower_label" th:text="${follower_count}" th:onclick="openFollowerModal([[${member.email}]])" ></label>
          <label class="form-label" th:onclick="openFollowingModal([[${member.email}]])">Following: </label>
          <label class="form-label" id="following_label" th:text="${following_count}" th:onclick="openFollowingModal([[${member.email}]])"></label>
        </div>
      </div>
    </div>
  </form>
  <div class="imgGrid"></div>
</div>
<th:block th:replace="~{fragments/board-modal :: boardModal}"></th:block>
<th:block th:replace="~{fragments/comment-modal :: commentModal}"></th:block>
<th:block th:replace="~{fragments/favorite-modal :: favoriteModal}"></th:block>
<th:block th:replace="~{fragments/follower-modal :: followerModal}"></th:block>
<th:block th:replace="~{fragments/following-modal :: followingModal}"></th:block>
<!--부트스트랩 js, jquery 추가-->
<script src="/js/lib/jquery.min.js"></script>
<script src="/js/lib/bootstrap.min.js"></script>
<script src="/js/follow/followerModal.js"></script>
<script src="/js/follow/followingModal.js"></script>
<script src="/js/comment/modal.js?v=20260823"></script>
<script src="/js/favorite/modal.js"></script>
<script src="/js/common/image-swipe.js"></script>
<script src="/js/member/boardModal.js?v=20260823"></script>
<script src="/js/common/image-upload.js?v=20260905-1"></script>
<script src="/js/member/detail.js?v=20260905-1"></script>
<script src="/js/common/common.js?v=20260824-1"></script>
</body>
<th:block th:replace="~{fragments/common :: pageFooter}"></th:block>
</html>
