<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
    <link rel="stylesheet" href="/css/common/common.css?v=20260830">
    <link rel="stylesheet" href="/css/chat/chat.css?v=20260830">
    <link rel="stylesheet" href="/css/chat/room-details.css?v=20260912">
    <title>Chatting Room</title>
</head>
<body th:classappend="${isMobile} ? 'mobile-view' : ''">
    <script src="/js/common/theme.js"></script>
    <input type="hidden" id="room" th:value="${room}">
    <input type="hidden" id="email" th:value="${member}">
    <input type="hidden" id="isAdmin" th:value="${isAdmin}">
    <input type="hidden" id="flag" th:value="${flag}">
    <header class="chat-room-header">
        <div class="chat-room-participants">
                <span th:each="name, stat : ${participantNames}"
                      th:text="${name + (stat.last ? '' : ', ')}">참여자</span>
        </div>
        <div class="chat-room-header-actions">
            <button th:if="${audioCallAvailable}" type="button" id="audio-call-start"
                    class="btn btn-success btn-sm">그룹 음성 통화</button>
            <button type="button" id="chat-details-open" class="chat-details-icon-button"
                    aria-label="채팅방 상세 열기" aria-controls="chat-details-panel" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
    </header>
    <div class="container chat-room-container">
        <form method="dialog" enctype="multipart/form-data">
        <div class="msgArea">
            <ul class="list-group-flush"></ul>
        </div>
        </form>
        <button type="button" id="new-message-notice" class="chat-new-message-notice is-hidden">
            새 메시지
        </button>
    </div>

    <section id="audio-call-panel" class="audio-call-panel is-hidden" role="dialog" aria-live="polite">
        <div class="audio-call-visual" aria-hidden="true">
            <span>VOICE CALL</span>
            <div class="audio-call-phone-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M6.6 10.8c1.7 3.3 3.3 4.9 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.7 3.8.7.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.7 21 3 13.3 3 3.7c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.6.7 3.8.1.4 0 .8-.2 1.1l-2.3 2.2z"/>
                </svg>
            </div>
        </div>
        <p id="audio-call-status" class="audio-call-status">통화 준비 중</p>
        <div id="audio-call-participants" class="audio-call-participants is-hidden"
             aria-label="그룹 통화 참여자"></div>
        <div class="audio-call-meta" aria-live="polite">
            <span id="audio-call-connection" class="audio-call-connection" data-state="idle">대기 중</span>
            <span id="audio-call-mute-status" class="audio-call-mute-status is-hidden">내 마이크 음소거됨</span>
            <time id="audio-call-duration" class="audio-call-duration is-hidden">00:00</time>
        </div>
        <div id="audio-call-devices" class="audio-call-devices is-hidden">
            <label for="audio-call-input">마이크</label>
            <select id="audio-call-input" class="form-select form-select-sm"></select>
            <label for="audio-call-output">스피커</label>
            <select id="audio-call-output" class="form-select form-select-sm"></select>
        </div>
        <div class="audio-call-actions">
            <button type="button" id="audio-call-accept" class="btn btn-success is-hidden">받기</button>
            <button type="button" id="audio-call-reject" class="btn btn-secondary is-hidden">거절</button>
            <button type="button" id="audio-call-mute" class="btn btn-outline-secondary is-hidden">음소거</button>
            <button type="button" id="audio-call-hangup" class="btn btn-danger is-hidden">통화 종료</button>
        </div>
        <div id="audio-call-remotes" class="audio-call-remotes" aria-hidden="true"></div>
    </section>
    <div class="chat-room-controls">
        <textarea class="form-control" id="chat" name="chat" rows="1" cols="" placeholder="보낼 메세지를 입력하세요." onkeydown="send(event)"></textarea>
        <button type="button" value="전송" class="btn btn-primary" onclick="sendMsg()">전송</button>
        <input type="file" id="upload" name="file" accept="image/*" onchange="fnLoad(this)" class="is-hidden" multiple/>
        <button type="button" class="btn btn-primary" id="btn">이미지 전송</button>
        <button type="button" value="방나가기" class="btn btn-danger" onclick="quit()" formmethod="post">방 나가기</button>
    </div>

    <div id="chat-details-overlay" class="chat-details-overlay" hidden>
        <button type="button" id="chat-details-backdrop" class="chat-details-backdrop" tabindex="-1" aria-label="채팅방 상세 닫기"></button>
        <aside id="chat-details-panel" class="chat-details-panel" role="dialog" aria-modal="true" aria-labelledby="chat-details-title" tabindex="-1">
            <header class="chat-details-header">
                <h2 id="chat-details-title">채팅방 상세</h2>
                <button type="button" id="chat-details-close" class="chat-details-icon-button" aria-label="채팅방 상세 닫기">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
                </button>
            </header>
            <div class="chat-details-body">
                <div class="chat-details-summary">
                    <h3 id="chat-details-room-name">채팅방</h3>
                    <button type="button" id="chat-details-refresh" class="btn btn-outline-primary btn-sm">새로고침</button>
                </div>
                <p id="chat-details-update" class="chat-details-muted" role="status" hidden></p>
                <section aria-labelledby="chat-details-members-title">
                    <h3 id="chat-details-members-title">참여자 <span id="chat-details-member-count"></span></h3>
                    <p id="chat-details-members-status" class="chat-details-muted" role="status"></p>
                    <ul id="chat-details-members" class="chat-details-members"></ul>
                </section>
                <section aria-labelledby="chat-details-images-title">
                    <h3 id="chat-details-images-title">주고받은 사진</h3>
                    <p class="chat-details-muted">최근 등록된 사진부터 표시합니다. 삭제한 메시지의 사진은 제외됩니다.</p>
                    <p id="chat-details-images-status" class="chat-details-muted" role="status"></p>
                    <div id="chat-details-images" class="chat-details-images"></div>
                    <button type="button" id="chat-details-more" class="btn btn-outline-primary chat-details-more" hidden>사진 더 보기</button>
                </section>
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/js/lib/jquery.min.js"></script>
    <script src="/js/lib/bootstrap.min.js"></script>
    <script src="/js/common/image-swipe.js"></script>
    <script src="/js/common/image-upload.js?v=20260905-1"></script>
    <script src="/js/chat/chat.js?v=20260912"></script>
    <script src="/js/chat/room-details.js?v=20260912"></script>
    <script src="/js/chat/audio-call.js?v=20260824-2"></script>
</body>
<footer>
    <div class="card">
        <div class="card-body text-center">
            <p class="card-text"><small class="text-muted">Copyright Park Kwanwoo. All Rights Reserved.</small></p>
        </div>
    </div>
</footer>
</html>
