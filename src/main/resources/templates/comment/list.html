<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>댓글</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
  <link rel="stylesheet" href="/css/common/common.css?v=20261118-standalone">
  <link rel="stylesheet" href="/css/comment/modal.css?v=20261118-thread">
  <link rel="stylesheet" href="/css/comment/list.css?v=20261118-thread">
</head>
<body class="standalone-page standalone-list-page comment-list-page" th:classappend="${isMobile} ? ' mobile-view' : ''">
<script src="/js/common/theme.js"></script>
<th:block th:replace="~{fragments/common :: memberNavi(${email}, ${profile})}"></th:block>
<main class="container" th:attr="data-board-id=${boardId},data-member-email=${member}">
  <th:block th:replace="~{fragments/common :: notificationBanner}"></th:block>
  <header class="standalone-page-header">
    <th:block th:replace="~{fragments/common :: pageBack(@{/board/view(id=${boardId})})}"></th:block>
    <h1 class="simple-page-title">댓글</h1>
  </header>
  <ul class="list-group-flush standalone-list" id="commentList"></ul>
  <div class="comment-composer">
    <button type="button" class="btn btn-link btn-sm is-hidden" id="cancel">답글 달기 취소</button>
    <div class="comment-compose-fields">
      <textarea class="form-control" id="comments" rows="2" name="Comment" placeholder="댓글을 입력하세요" aria-label="댓글 내용"></textarea>
      <button type="button" id="submit" class="btn btn-primary">등록</button>
    </div>
  </div>
</main>
<script src="/js/lib/jquery.min.js"></script>
<script src="/js/lib/bootstrap.min.js"></script>
<script src="/js/comment/panel.js?v=20261118-thread"></script>
<script src="/js/comment/list.js?v=20261118-thread"></script>
<script src="/js/common/common.js?v=20261116-navigation"></script>
<th:block th:replace="~{fragments/common :: pageFooter}"></th:block>
</body>
</html>
